# Separate Plex stack for recovery after a suspected compromised Plex installation.
# DO NOT reuse /opt/arr-stack/config/plex; preserve its contents for investigation.
# Before deployment, reserve 192.168.1.89 for this Ubuntu server and create
# /opt/arr-stack/config/plex-fresh and /opt/arr-stack/transcode with UID/GID 1000 ownership.
# Keep UniFi TCP 32400 port forwarding DISABLED during incident recovery.
# A LAN-IP Docker bind alone cannot block router NAT/forwarding.
# A new bridge-mode Plex server may require a one-time PLEX_CLAIM value.
# Provide PLEX_CLAIM in Portainer's stack environment (never commit a token to Git).
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
      - ADVERTISE_IP=http://192.168.1.89:32400/
    ports:
      - "192.168.1.89:32400:32400/tcp"
    volumes:
      - /opt/arr-stack/config/plex-fresh:/config
      - /opt/arr-stack/media:/media:ro
      - /opt/arr-stack/transcode:/transcode
    security_opt:
      - no-new-privileges:true
    networks:
      - plex_network

networks:
  plex_network:
    driver: bridge
