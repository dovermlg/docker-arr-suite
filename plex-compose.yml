# Deploy as a separate Portainer Git stack using plex-compose.yml.
# Keep the old /opt/arr-stack/config/plex directory untouched for investigation.
# Before deployment: mkdir -p /opt/arr-stack/config/plex-fresh /opt/arr-stack/transcode
# and ensure the container user (UID/GID 1000) can write its config/transcode dirs.
# Keep the UniFi/WAN port-forward for TCP 32400 disabled.
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - VERSION=docker
    ports:
      # LAN access only if your router does not forward this port from the internet.
      - "32400:32400/tcp"
    volumes:
      - /opt/arr-stack/config/plex-fresh:/config
      - /opt/arr-stack/media:/media:ro
      - /opt/arr-stack/transcode:/transcode
    security_opt:
      - no-new-privileges:true
    networks:
      - plex_network

networks:
  plex_network:
    driver: bridge

